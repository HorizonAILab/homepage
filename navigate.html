<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="BlueRevision and publication pages by Tingjin Luo.">
<link rel="icon" type="image/png" sizes="32x32" href="icons/navigation.png">
<link rel="icon" type="image/svg+xml" href="icons/navigation.svg">
<title>Navigation — Tingjin Luo</title>
<style>
:root { color-scheme:light; --bg:#f7f8fa; --ink:#27323e; --muted:#65717e; --line:#dce2e8; --accent:#496a89; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
a { color:inherit; text-decoration:none; }
a:focus-visible { outline:2px solid var(--accent); outline-offset:5px; border-radius:3px; }
.page { width:min(680px,calc(100% - 48px)); margin:0 auto; padding:56px 0 72px; }
.topbar { display:flex; align-items:center; justify-content:space-between; gap:24px; }
.name { font-size:13px; font-weight:550; letter-spacing:.01em; }
.home { display:inline-flex; align-items:center; gap:6px; min-height:44px; font-size:12px; color:var(--muted); }
.home:hover { color:var(--accent); }
svg { flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.home svg { width:15px; height:15px; }
main { margin-top:54px; }
h1 { margin:0 0 30px; font-size:clamp(28px,5vw,36px); font-weight:620; letter-spacing:-.04em; line-height:1.2; }
.entries { border-top:1px solid var(--line); }
.entry { display:grid; grid-template-columns:22px minmax(0,1fr) 18px; gap:16px; align-items:center; min-height:80px; padding:20px 12px; border-bottom:1px solid var(--line); transition:background-color .15s,color .15s; }
.entry-icon { width:22px; height:22px; color:var(--accent); }
.entry-title { min-width:0; margin:0; font-size:19px; font-weight:610; letter-spacing:-.02em; line-height:1.35; }
.entry-arrow { width:17px; height:17px; color:var(--muted); }
.entry:hover { background:#eef2f6; color:var(--accent); }
.entry:hover .entry-arrow { color:var(--accent); }
.entry:focus-visible { background:#eef2f6; outline-offset:-3px; }
@media(max-width:480px) { .page { width:calc(100% - 40px); padding-top:26px; } main { margin-top:38px; } .entry { gap:14px; min-height:76px; padding:18px 8px; } h1 { margin-bottom:26px; } }
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; } }
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <span class="name">Tingjin Luo</span>
    <nav aria-label="Page navigation">
      <a class="home" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 12H5m6-6-6 6 6 6"/></svg>Home</a>
    </nav>
  </header>
  <main>
    <h1>Navigation</h1>
    <nav class="entries" aria-label="Tools and publications">
      <a class="entry" href="blue-revision/index.html">
        <svg class="entry-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m16 3 5 5-12 12-6 1 1-6 12-12Z"/><path d="m14 5 5 5"/></svg>
        <span class="entry-title">BlueRevision</span>
        <svg class="entry-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
      </a>
      <a class="entry" href="publications.html">
        <svg class="entry-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 3h6v18H4zM10 3h5v18h-5M17 5l3-1 3 15-3 1-3-15Z"/></svg>
        <span class="entry-title">Publication</span>
        <svg class="entry-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
      </a>
    </nav>
  </main>
</div>
</body>
</html>
