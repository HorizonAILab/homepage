  if(end<text.length&&/[\uD800-\uDBFF]/.test(text[end-1])&&/[\uDC00-\uDFFF]/.test(text[end]))end--;
  return{start,end};
}
function lineBounds(text,line){
  if(!Number.isInteger(line)||line<1)return null;
  let start=0;
  for(let i=1;i<line;i++){const next=text.indexOf('\n',start);if(next<0)return null;start=next+1;}
  let end=text.indexOf('\n',start);if(end<0)end=text.length;
  return{start,end:Math.min(text.length,Math.max(start+1,end))};
}
function correspondingOldOffset(oldText,newText,offset){
  let line=1;
  for(let pos=0;pos<Math.min(offset,newText.length);pos++)if(newText[pos]==='\n')line++;
  return lineBounds(oldText,line)?.start??oldText.length;
}
function markedRanges(text,macro){
  if(!macro)return[];
  const ranges=[],needle='\\'+macro+'{';let i=0;
  while(i<text.length){
    const start=text.indexOf(needle,i);if(start<0)break;
    let end=start+needle.length,depth=1;
    while(end<text.length&&depth){if(text[end]==='\\'){end=Math.min(text.length,end+2);continue;}if(text[end]==='{')depth++;if(text[end]==='}')depth--;end++;}
    ranges.push({start,end});i=end;
  }
  return ranges;
}
function previewData(){
  const file=state.result?.files.find(f=>f.path===state.selected);if(!file)return null;
  if(state.preview?.file===file&&state.preview.mode===state.mode&&state.preview.marked===state.marked)return state.preview;
  const entry=state.mode==='output'?state.marked?.entries.find(x=>x.path===file.path):null;
  const text=state.mode==='output'?(entry?.text??state.marked?.files.get(file.path)?.text??file.newText):file.newText;
  const ranges=!file.isTex||file.status==='deleted'?[]:state.mode==='output'?(Array.isArray(entry?.outputRanges)?entry.outputRanges:markedRanges(text,state.marked?.macro)):(file.ranges??[]);
  return state.preview={file,mode:state.mode,marked:state.marked,text,ranges,anchor:0,review:null};
}
function appendRanges(pre,text,ranges,view=previewWindow(text),selected=-1,review=null){
  pre.replaceChildren();pre.dataset.windowStart=String(view.start);pre.dataset.windowEnd=String(view.end);
  pre.title=view.start>0||view.end<text.length?'预览片段 · 导出保留全文':'';
  function ellipsis(value){const span=document.createElement('span');span.textContent=value;span.setAttribute('aria-hidden','true');pre.append(span);}
  function segment(start,end,index=-1){
    if(end<=start)return;
    const cuts=[start,end];if(review)for(const boundary of [review.start,review.end])if(boundary>start&&boundary<end)cuts.push(boundary);
    cuts.sort((a,b)=>a-b);
    for(let i=1;i<cuts.length;i++){
      const a=cuts[i-1],b=cuts[i];let node=document.createTextNode(text.slice(a,b));
      if(index>=0){const mark=document.createElement('mark');mark.dataset.changeIndex=String(index);mark.classList.toggle('focus',index===selected);mark.append(node);node=mark;}
      if(review&&a<review.end&&b>review.start){const span=document.createElement('span');span.className='review-line';span.append(node);node=span;}
      pre.append(node);
    }
  }
  if(view.start>0)ellipsis('…\n');
  let pos=view.start;
  for(let index=0;index<(ranges??[]).length;index++){
    const range=ranges[index];if(range.start>=view.end)break;if(range.end<=view.start)continue;
    const start=Math.max(pos,range.start,view.start),end=Math.min(range.end,view.end);if(end<=start)continue;
    segment(pos,start);segment(start,end,index);pos=end;
  }
  segment(pos,view.end);
  if(view.end<text.length)ellipsis('\n…');
}
function renderViewer(target={}){
  const data=previewData();if(!data)return;const f=data.file;
  if(Number.isFinite(target.anchor))data.anchor=target.anchor;
  if(Object.prototype.hasOwnProperty.call(target,'review'))data.review=target.review;
  const mapping=f.oldPath&&f.oldPath!==f.path?`${f.oldPath} → ${f.path}`:f.path;
  $('viewer-path').textContent=mapping;$('viewer-path').title=mapping;$('viewer-kind').textContent=f.oldPath&&f.oldPath!==f.path&&f.status==='modified'?'改名 · 修改':labels[f.status];
  $('tab-diff').classList.toggle('active',state.mode==='diff');$('tab-output').classList.toggle('active',state.mode==='output');
  $('tab-diff').setAttribute('aria-pressed',String(state.mode==='diff'));$('tab-output').setAttribute('aria-pressed',String(state.mode==='output'));
  $('tab-diff').tabIndex=0;$('tab-output').tabIndex=0;$('old-pane').hidden=!state.split;$('source-grid').classList.toggle('split',state.split);
  const oldPre=$('old-source');
  if(!state.split)oldPre.replaceChildren();
  else if(!f.isTex)oldPre.textContent='资源文件';
  else{const oldAnchor=correspondingOldOffset(f.oldText,data.text,data.anchor);appendRanges(oldPre,f.oldText,[],previewWindow(f.oldText,oldAnchor));}
  $('new-pane-label').textContent=state.mode==='output'?'输出 TEX':'新版';const pre=$('new-source');
  if(f.status==='deleted')pre.textContent='已从新版删除';
  else if(!f.isTex)pre.textContent='资源文件按新版原样保留';
  else{data.window=previewWindow(data.text,data.anchor);appendRanges(pre,data.text,data.ranges,data.window,state.change,data.review);}
  setNavigation();
}
function setNavigation(){
  const ranges=previewData()?.ranges??[];if(state.change>=ranges.length)state.change=-1;
  $('change-index').textContent=ranges.length?`${state.change>=0?state.change+1:'–'} / ${ranges.length}`:'';
  $('prev-change').disabled=!ranges.length;$('next-change').disabled=!ranges.length;
}
function navigate(delta){
  const data=previewData();if(!data?.ranges.length)return;const total=data.ranges.length;
  state.change=state.change<0?(delta>0?0:total-1):(state.change+delta+total)%total;
  renderViewer({anchor:data.ranges[state.change].start,review:null});
  $('new-source').querySelector(`mark[data-change-index="${state.change}"]`)?.scrollIntoView({block:'center',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
function issueItems(){const issues=[...(state.marked?.skipped??[])];for(const w of state.result?.warnings??[])if(/超过精细|回退为|未猜测|大小写/.test(w))issues.push({path:'工程',line:null,reason:w});return issues;}
function renderIssues(){const issues=issueItems();$('issues').hidden=!issues.length;$('issues').open=false;$('issue-summary').textContent=`${issues.length} 处需检查`;$('issue-list').replaceChildren();for(const item of issues){const b=document.createElement('button');b.className='issue-item';const p=document.createElement('span');p.className='issue-path';p.textContent=item.path+(item.line?`:${item.line}`:'');const reason=document.createElement('span');reason.className='issue-reason';reason.textContent=item.reason;b.append(p,reason);b.addEventListener('click',()=>{if(state.result.files.some(f=>f.path===item.path)){state.selected=item.path;state.mode='diff';state.change=-1;renderFiles();renderViewer();if(item.line){focusLine(item.line);}}});$('issue-list').append(b);}}
function downloadKind(){if(!state.new||!state.marked)return 'zip';return state.new.single&&(!state.marked.fragment||!state.marked.markedCount)&&!$('include-report').checked?'tex':'zip';}
function fileValue(text){const bytes=new TextEncoder().encode(text);return{text,bytes,size:bytes.length};}
function makeReport(){return{tool:'BlueRevision',version:'0.4',granularity:state.granularity,main:$('main-file').value,markedCount:state.marked.markedCount,skipped:state.marked.skipped,changes:state.result.files.map(f=>({path:f.path,oldPath:f.oldPath??null,pairing:f.pairing??null,similarity:f.similarity??null,status:f.status,addedTokens:f.addedCount,removedTokens:f.removedCount,changes:f.ranges.length,countsPartial:Boolean(f.unresolved?.length),unresolved:f.unresolved||[]})),warnings:state.result.warnings};}
function saveBytes(bytes,name,type){const url=URL.createObjectURL(new Blob([bytes],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),4000);}
async function download(){if(!state.marked||state.busy)return;if(state.marked.fragment&&state.marked.markedCount){$('fragment-dialog').showModal();return;}performDownload();}
function performDownload(){try{const base=state.new.name.replace(/\.(?:tex|zip)$/i,'');if(downloadKind()==='tex'){const source=[...state.marked.files].find(([path])=>/\.tex$/i.test(path));if(!source)throw new Error('没有可导出的 TEX');saveBytes(source[1].bytes,base+'_blue.tex','application/x-tex;charset=utf-8');}else{const files=new Map(state.marked.files);if(state.marked.fragment&&state.marked.markedCount&&state.marked.preamble){if(files.has('blue_revision_preamble.tex'))throw new Error('工程中已有 blue_revision_preamble.tex，请先重命名该文件');files.set('blue_revision_preamble.tex',fileValue(state.marked.preamble));}if($('include-report').checked){const name='blue_revision_report.json';if(files.has(name))throw new Error('工程中已有同名检查清单，请先重命名');files.set(name,fileValue(JSON.stringify(makeReport(),null,2)));}saveBytes(BlueMark.writeZip(files),base+'_blue.zip','application/zip');}feedback(issueItems().length?'已下载 · 展开检查清单核对未标记内容':'已下载');}catch(e){feedback(e.message||String(e),true);}}
$('download').addEventListener('click',download);$('fragment-download').addEventListener('click',()=>{$('fragment-dialog').close();performDownload();});
$('file-search').addEventListener('input',renderFiles);$('split').addEventListener('click',()=>{state.split=!state.split;$('split').setAttribute('aria-pressed',String(state.split));renderViewer();});$('tab-diff').addEventListener('click',()=>{state.mode='diff';state.change=-1;renderViewer();});$('tab-output').addEventListener('click',()=>{state.mode='output';state.change=-1;renderViewer();});$('prev-change').addEventListener('click',()=>navigate(-1));$('next-change').addEventListener('click',()=>navigate(1));
document.querySelectorAll('[data-gran]').forEach(b=>b.addEventListener('click',()=>{state.granularity=b.dataset.gran;document.querySelectorAll('[data-gran]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b));});compare();}));
$('settings-open').addEventListener('click',()=>{$('settings').showModal();$('settings-open').setAttribute('aria-expanded','true');});$('settings').addEventListener('close',()=>$('settings-open').setAttribute('aria-expanded','false'));for(const id of ['main-file','math','ignore-comments','ignore-whitespace','ignore-moves'])$(id).addEventListener('change',compare);$('only-changes').addEventListener('change',renderFiles);$('include-report').addEventListener('change',()=>{if(state.marked)$('download-label').textContent=downloadLabel();});
for(const id of ['settings','fragment-dialog'])$(id).addEventListener('click',e=>{if(e.target===$(id)){const r=$(id).getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$(id).close();}});
function project(name,texts,single=false){return{name,single,files:new Map(Object.entries(texts).map(([path,text])=>[path,fileValue(text)])),warnings:[]};}
function demo(){for(const side of ['old','new']){state.loadId[side]++;$(side+'-error').hidden=true;}state.reading.clear();invalidate();state.demo=true;const old=String.raw`\documentclass[UTF8]{ctexart}
\usepackage{amsmath}
\begin{document}

\section{多视图学习}
不同视图提供互补的信息。
我们将多个视图的特征拼接，获得最终表示。
这一方法可以提升预测性能。

\begin{equation}

\end{equation}

\end{document}
`;const fresh=String.raw`\documentclass[UTF8]{ctexart}
\usepackage{amsmath}
\begin{document}

\section{语义引导的多视图学习}
不同视图提供互补的信息。

`;state.old=project('旧稿.tex',{'main.tex':old},true);state.new=project('新版.tex',{'main.tex':fresh},true);renderUpload('old');renderUpload('new');renderMain();compare();}
$('demo').addEventListener('click',demo);$('empty-demo').addEventListener('click',demo);

for(const id of ['tab-diff','tab-output'])$(id).addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const target=e.key==='Home'?'tab-diff':e.key==='End'?'tab-output':id==='tab-diff'?'tab-output':'tab-diff';$(target).click();$(target).focus();}});

function downloadLabel(){const base=state.marked?.markedCount?'下载标蓝':'下载新版';return base+(downloadKind()==='tex'?' TEX':' ZIP');}

function focusLine(line){
  const f=state.result?.files.find(file=>file.path===state.selected);if(!f?.isTex)return;
